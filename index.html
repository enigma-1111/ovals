<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Oval Room</title>
<meta name="description" content="Walk the Oval Room." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='11' ry='14' fill='none' stroke='%23c6a15b' stroke-width='2'/%3E%3C/svg%3E" />
<style>
  html, body { margin:0; height:100%; background:#14110f; color:#efe4d2; font:14px/1.3 Palatino, Georgia, serif; overflow:hidden; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  h1 { position:fixed; top:14px; left:16px; margin:0; letter-spacing:.28em; font-size:11px; color:#c9a15a; z-index:2; }
  #connect, .pad button, .panel button, .panel input, .panel a { font:13px/1 Palatino, Georgia, serif; color:#efe4d2; background:rgba(10,8,7,.7); border:1px solid rgba(201,161,90,.5); border-radius:999px; padding:8px 12px; }
  #connect { position:fixed; top:10px; right:12px; z-index:3; }
  #status { position:fixed; top:42px; left:16px; color:#b7a48d; font-size:12px; z-index:2; }
  #plaque { position:fixed; left:50%; bottom:108px; transform:translateX(-50%); min-width:160px; text-align:center; background:#d9c7a2; color:#2b2116; padding:8px 12px; display:none; z-index:3; }
  #plaque b { display:block; }
  .pad { position:fixed; left:14px; bottom:22px; display:grid; grid-template-columns:48px 48px 48px; gap:6px; z-index:3; }
  .pad button { width:48px; height:48px; border-radius:12px; }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; place-items:end center; z-index:6; }
  .sheet.on { display:grid; }
  .panel { width:min(440px,100%); background:#1a120f; padding:18px 18px 28px; border-radius:18px 18px 0 0; }
  .panel button, .panel a, .panel input { display:block; width:100%; margin:8px 0; text-align:center; text-decoration:none; }
</style>
</head>
<body>
<h1>OVAL ROOM</h1>
<div id="status">Opening the hall</div>
<button id="connect">Enter</button>
<div id="plaque"></div>
<div class="pad">
  <span></span><button id="up">↑</button><span></span>
  <button id="left">←</button><button id="down">↓</button><button id="right">→</button>
</div>
<div class="sheet" id="sheet">
  <div class="panel">
    <p>The desk</p>
    <button id="use-here">Wallet in this browser</button>
    <a href="https://rainbow.me/dapp/ovals.vercel.app">Rainbow</a>
    <a href="https://go.cb-w.com/dapp?cb_url=https%3A%2F%2Fovals.vercel.app">Coinbase Wallet</a>
    <a href="https://link.trustwallet.com/open_url?coin_id=60&url=https%3A%2F%2Fovals.vercel.app">Trust Wallet</a>
    <input id="addr" placeholder="Paste 0x address" autocapitalize="off" spellcheck="false" />
    <button id="use-addr">Check this address</button>
    <button id="close-sheet">Step back</button>
    <p id="sheet-note"></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const CONTRACT = "0xb8611673d94f3846c619e2a146b84e793f93f931";
const CHAIN = "0x1237";
const RPC = "https://rpc.mainnet.chain.robinhood.com";
const BUY = "https://opensea.io/collection/oval-room";
const MINT_BLOCK = 83602400;
const status = document.getElementById("status");
if (!window.THREE) { status.textContent = "The hall did not load. Refresh."; throw new Error("three"); }
const THREE = window.THREE;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x221c18);
scene.fog = new THREE.Fog(0x221c18, 28, 78);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 140);
camera.position.set(0, 1.6, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
document.body.insertBefore(renderer.domElement, document.body.firstChild);
scene.add(new THREE.AmbientLight(0xfff6ea, 1.05));
scene.add(new THREE.HemisphereLight(0xfff3e0, 0x3a2c22, 0.55));
function mesh(geo, color, x, y, z) {
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color }));
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}
mesh(new THREE.BoxGeometry(16, 0.25, 64), 0x3a2a1c, 0, 0, -10);
mesh(new THREE.BoxGeometry(16, 0.12, 64), 0x241c18, 0, 5.1, -10);
mesh(new THREE.BoxGeometry(0.35, 5, 64), 0x2a221c, -8, 2.5, -10);
mesh(new THREE.BoxGeometry(0.35, 5, 64), 0x2a221c, 8, 2.5, -10);
mesh(new THREE.CylinderGeometry(7, 7, 0.25, 32), 0x3a2a1c, 0, 0, 18);
mesh(new THREE.CylinderGeometry(6.2, 6.2, 4.6, 28, 1, true), 0x2a221c, 0, 2.4, 18);
mesh(new THREE.CylinderGeometry(8, 8, 0.25, 32), 0x3a2a1c, 0, 0, -36);
mesh(new THREE.CylinderGeometry(7.2, 7.2, 4.6, 28, 1, true), 0x2a221c, 0, 2.4, -36);
for (let i = -7; i <= 7; i += 2) mesh(new THREE.BoxGeometry(0.04, 0.04, 64), 0x4a4038, i, 5.02, -10);
for (let z = 18; z >= -40; z -= 4) mesh(new THREE.BoxGeometry(16, 0.03, 0.04), 0x4a4038, 0, 5.02, z);
for (let z = 6; z >= -24; z -= 10) {
  mesh(new THREE.BoxGeometry(1.8, 0.14, 0.5), 0x6a5040, 0, 0.46, z);
  mesh(new THREE.BoxGeometry(0.12, 0.42, 0.12), 0x4a3424, -0.7, 0.2, z);
  mesh(new THREE.BoxGeometry(0.12, 0.42, 0.12), 0x4a3424, 0.7, 0.2, z);
}
function statue(x, z) {
  const stone = 0xd8d0c4;
  mesh(new THREE.CylinderGeometry(0.42, 0.5, 0.16, 16), 0xb7a48a, x, 0.1, z);
  mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.7, 16), 0xcfc6b8, x, 0.52, z);
  mesh(new THREE.SphereGeometry(0.22, 16, 12), stone, x, 1.55, z);
  mesh(new THREE.CylinderGeometry(0.16, 0.22, 0.7, 12), stone, x, 1.05, z);
  const lamp = new THREE.PointLight(0xfff4e2, 0.35, 5);
  lamp.position.set(x, 2.4, z);
  scene.add(lamp);
}
statue(-3.2, 4);
statue(3.2, -6);
statue(-3.2, -18);
statue(3.2, -30);
function plant(x, z) {
  mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.28, 10), 0x6a5340, x, 0.16, z);
  mesh(new THREE.SphereGeometry(0.28, 10, 8), 0x3d5a3a, x, 0.5, z);
}
plant(-6.6, 2);
plant(6.6, -2);
plant(-6.6, -14);
plant(6.6, -26);
mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.08, 20), 0xcfc6b8, 0, 0.06, -36);
mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.04, 20), 0x8eb8c8, 0, 0.12, -36);
const walkers = [];
function person(x, z, color, path) {
  const g = new THREE.Group();
  const cloth = new THREE.MeshLambertMaterial({ color });
  const skin = new THREE.MeshLambertMaterial({ color: 0xe2c2a4 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.85, 10), cloth);
  body.position.y = 0.85;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), skin);
  head.position.y = 1.42;
  const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.7, 8), cloth);
  legL.position.set(-0.08, 0.35, 0);
  const legR = legL.clone();
  legR.position.x = 0.08;
  g.add(body, head, legL, legR);
  g.position.set(x, 0, z);
  scene.add(g);
  walkers.push({ mesh: g, path, i: 0, wait: 1 + Math.random() * 2 });
  return g;
}
person(-5.4, 12, 0x8a3a32, [[-5.4,12],[-5.2,6],[-5.4,-2],[-5.2,-12],[-4.8,-22],[0,-34],[-5.4,12]]);
person(-4.8, 7, 0x2f4a62, [[-4.8,7],[5.2,2],[5.4,-8],[4.8,-18],[0,-34],[-4.8,7]]);
person(5.2, 4, 0x3d3a34, [[5.2,4],[5.4,-6],[4.6,-16],[5.2,-26],[0,-34],[5.2,4]]);
person(-4.4, 0, 0xc45a4a, [[-4.4,0],[-5.2,-8],[-4.6,-18],[0,-30],[-4.4,0]]);
person(0.2, -8, 0x4a5560, [[0.2,-8],[3,-16],[-3,-24],[0,-34],[0.2,-8]]);
person(5.4, -16, 0x2c3a4a, [[5.4,-16],[4.8,-24],[0,-34],[-5,-20],[5.4,-16]]);
const frames = [];
const loader = new THREE.TextureLoader();
loader.setCrossOrigin("anonymous");
function hexPad(n) { return Number(n).toString(16).padStart(64, "0"); }
async function rpc(method, params) {
  const res = await fetch(RPC, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ jsonrpc:"2.0", id:1, method, params }) });
  const json = await res.json();
  if (json.error) throw new Error(json.error.message || "The chain did not answer.");
  return json.result;
}
function decodeAbiString(hex) {
  const h = hex.replace(/^0x/, "");
  const len = parseInt(h.slice(64, 128), 16);
  const bytes = h.slice(128, 128 + len * 2);
  let s = "";
  for (let i = 0; i < bytes.length; i += 2) s += String.fromCharCode(parseInt(bytes.slice(i, i + 2), 16));
  return s;
}
async function loadToken(id) {
  const meta = JSON.parse(atob(decodeAbiString(await rpc("eth_call", [{ to:CONTRACT, data:"0xc87b56dd" + hexPad(id) }, "latest"])).split(",")[1]));
  const attr = (k) => { const a = (meta.attributes || []).find(x => (x.trait_type || "").toLowerCase() === k); return a ? String(a.value) : ""; };
  return { id, name: meta.name, image: meta.image, method: attr("method"), year: attr("year") };
}
function hang(nft, x, z) {
  const g = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.25, 0.08), new THREE.MeshLambertMaterial({ color: 0xd7b56a }));
  const mat = new THREE.MeshBasicMaterial({ color: 0x2a2118 });
  const art = new THREE.Mesh(new THREE.PlaneGeometry(1.42, 1.82), mat);
  art.position.z = 0.05;
  g.add(frame, art);
  g.position.set(x, 2.2, z);
  g.lookAt(0, 2.2, z);
  scene.add(g);
  const bulb = new THREE.PointLight(0xfff6e8, 1.1, 8);
  bulb.position.set(x * 0.7, 4.2, z);
  scene.add(bulb);
  frames.push({ mesh: art, nft });
  if (nft.image) loader.load(nft.image, (tex) => { mat.map = tex; mat.color.set(0xffffff); mat.needsUpdate = true; });
}
async function fill(ids, side, start) {
  for (let i = 0; i < ids.length; i++) {
    try { hang(await loadToken(ids[i]), side, start - i * 5.2); } catch (e) {}
  }
}
fill([1,2,3,4,5,6,7,8], -7.4, 12).then(() => status.textContent = "They are looking");
fill([9,10,11,12,13,14,15,16], 7.4, 12);
const keys = {};
addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
let yaw = 0, pitch = 0, dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener("pointerdown", (e) => { dragging = e.clientX > innerWidth * 0.38; lastX = e.clientX; lastY = e.clientY; });
renderer.domElement.addEventListener("pointerup", () => dragging = false);
renderer.domElement.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  yaw -= (e.clientX - lastX) * 0.005;
  pitch = Math.max(-0.45, Math.min(0.45, pitch - (e.clientY - lastY) * 0.004));
  lastX = e.clientX; lastY = e.clientY;
});
function hold(id, code) {
  const b = document.getElementById(id);
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); keys[code] = true; });
  b.addEventListener("pointerup", () => keys[code] = false);
  b.addEventListener("pointerleave", () => keys[code] = false);
  b.addEventListener("pointercancel", () => keys[code] = false);
}
hold("up", "w"); hold("down", "s"); hold("left", "a"); hold("right", "d");
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener("click", (e) => {
  ray.setFromCamera({ x: (e.clientX / innerWidth) * 2 - 1, y: -(e.clientY / innerHeight) * 2 + 1 }, camera);
  const hit = ray.intersectObjects(frames.map(f => f.mesh))[0];
  const box = document.getElementById("plaque");
  if (!hit) { box.style.display = "none"; return; }
  const nft = frames.find(f => f.mesh === hit.object).nft;
  box.style.display = "block";
  box.innerHTML = `<b>${nft.name || ("Oval " + nft.id)}</b>${[nft.method, nft.year].filter(Boolean).join(" · ")}`;
});
function validAddress(v) { return /^0x[a-fA-F0-9]{40}$/.test((v || "").trim()); }
async function balanceOf(address) { return parseInt(await rpc("eth_call", [{ to:CONTRACT, data:"0x70a08231" + address.toLowerCase().replace("0x","").padStart(64,"0") }, "latest"]), 16) || 0; }
async function heldIds(address) {
  const me = address.toLowerCase();
  const latest = parseInt(await rpc("eth_blockNumber", []), 16);
  const end = Math.min(latest, MINT_BLOCK + 20000);
  const logs = [];
  for (let b = MINT_BLOCK; b <= end; b += 5000) {
    const chunk = await rpc("eth_getLogs", [{ address:CONTRACT, topics:["0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"], fromBlock:"0x"+b.toString(16), toBlock:"0x"+Math.min(end, b+4999).toString(16) }]);
    if (chunk && chunk.length) logs.push(...chunk);
  }
  const qty = new Map(), own = new Map();
  for (const log of logs) {
    const from = "0x" + log.topics[1].slice(26), to = "0x" + log.topics[2].slice(26), id = parseInt(log.topics[3], 16);
    if (from === "0x0000000000000000000000000000000000000000") {
      let n = qty.get(log.transactionHash);
      if (n == null) { try { n = parseInt((await rpc("eth_getTransactionByHash", [log.transactionHash])).input.slice(10, 74), 16) || 1; } catch { n = 1; } if (!n || n > 100) n = 1; qty.set(log.transactionHash, n); }
      for (let i = 0; i < n; i++) own.set(id + i, to);
    } else own.set(id, to);
  }
  return [...own.entries()].filter(([, who]) => who === me).map(([id]) => id);
}
async function enter(address) {
  localStorage.setItem("oval.address", address);
  document.getElementById("connect").textContent = address.slice(0,6) + "…" + address.slice(-4);
  document.getElementById("sheet").classList.remove("on");
  const count = await balanceOf(address).catch(() => 0);
  status.textContent = count ? ("Holder · " + count) : "Visitor";
  if (!count) { document.getElementById("plaque").style.display = "block"; document.getElementById("plaque").innerHTML = `No oval on this address. <a href="${BUY}">Acquire one</a>`; return; }
  const held = await heldIds(address).catch(() => []);
  fill(held.slice(0, 8), 7.4, -10);
}
function discovered() { const eth = window.ethereum; return eth && eth.providers ? eth.providers : eth ? [eth] : []; }
async function connectInjected(eth) {
  if (await eth.request({ method:"eth_chainId" }) !== CHAIN) {
    try { await eth.request({ method:"wallet_switchEthereumChain", params:[{ chainId:CHAIN }] }); }
    catch (err) { if (err.code === 4902) await eth.request({ method:"wallet_addEthereumChain", params:[{ chainId:CHAIN, chainName:"Robinhood Chain", nativeCurrency:{ name:"Ether", symbol:"ETH", decimals:18 }, rpcUrls:[RPC], blockExplorerUrls:["https://robinhoodchain.blockscout.com"] }] }); else throw err; }
  }
  await enter((await eth.request({ method:"eth_requestAccounts" }))[0]);
}
document.getElementById("connect").onclick = () => document.getElementById("sheet").classList.add("on");
document.getElementById("close-sheet").onclick = () => document.getElementById("sheet").classList.remove("on");
document.getElementById("use-here").onclick = async () => { const list = discovered(); if (!list[0]) { document.getElementById("sheet-note").textContent = "No wallet in this browser. Paste the address."; return; } try { await connectInjected(list[0]); } catch (err) { document.getElementById("sheet-note").textContent = err.message || "Refused."; } };
document.getElementById("use-addr").onclick = async () => { const address = document.getElementById("addr").value.trim(); if (!validAddress(address)) { document.getElementById("sheet-note").textContent = "Paste the full 0x address."; return; } await enter(address); };
const saved = localStorage.getItem("oval.address");
if (saved && validAddress(saved)) enter(saved);
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const dir = new THREE.Vector3();
  if (keys.w || keys.arrowup) dir.z -= 1;
  if (keys.s || keys.arrowdown) dir.z += 1;
  if (keys.a || keys.arrowleft) dir.x -= 1;
  if (keys.d || keys.arrowright) dir.x += 1;
  if (dir.length()) {
    dir.normalize();
    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
    camera.position.addScaledVector(dir, 4.2 * dt);
  }
  camera.position.x = Math.max(-6, Math.min(6, camera.position.x));
  camera.position.z = Math.max(-39, Math.min(20, camera.position.z));
  camera.position.y = 1.6;
  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
  renderer.render(scene, camera);
  const t = clock.elapsedTime;
  walkers.forEach((w) => {
    if (w.wait > 0) { w.wait -= dt; return; }
    const p = w.path[w.i];
    const dx = p[0] - w.mesh.position.x;
    const dz = p[1] - w.mesh.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.2) { w.i = (w.i + 1) % w.path.length; w.wait = 1.6 + Math.random() * 2.4; return; }
    w.mesh.position.x += dx / dist * 1.1 * dt;
    w.mesh.position.z += dz / dist * 1.1 * dt;
    w.mesh.lookAt(w.mesh.position.x + dx, 0, w.mesh.position.z + dz);
  });
  requestAnimationFrame(tick);
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
tick();
status.textContent = "They are looking";
</script>
</body>
</html>
