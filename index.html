<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oval Room</title>
<meta name="description" content="Oval Room museum. Holders enter. Visitors may look, play, and buy." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='11' ry='14' fill='none' stroke='%23c6a15b' stroke-width='2'/%3E%3C/svg%3E" />
<style>
  :root { --bg:#0e0b09; --line:#3a2e24; --gold:#c6a15b; --paper:#e7dcc8; --ink:#1c140e; --muted:#a89884; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--paper); font:16px/1.45 Georgia, serif; background:#0e0b09; }
  header { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:22px 6vw 8px; }
  h1 { margin:0; font-size:15px; letter-spacing:.2em; font-weight:500; text-transform:uppercase; }
  h1 span, a { color:var(--gold); }
  .sub, .note, .meta { color:var(--muted); }
  button, select, input { font:14px/1 Georgia, serif; color:var(--paper); background:#171310; border:1px solid var(--line); border-radius:999px; padding:10px 14px; }
  button { cursor:pointer; }
  button.gold, a.gold { border-color:var(--gold); color:var(--gold); }
  button.on { background:var(--paper); color:var(--ink); }
  main { padding:8px 6vw 80px; }
  .crest { width:88px; height:112px; margin:12px auto; border:2px solid var(--gold); border-radius:50%; display:grid; place-items:center; color:var(--gold); letter-spacing:.14em; font-size:11px; }
  .doors { display:grid; grid-template-columns:repeat(auto-fill, minmax(148px, 1fr)); gap:12px; margin:16px 0; }
  .doorbtn { border-radius:18px; min-height:88px; text-align:left; background:linear-gradient(#2a1c18, #140f0d); }
  .doorbtn small { display:block; color:var(--muted); margin-top:6px; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 16px; }
  .wall { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:16px; }
  .card { background:linear-gradient(#241c17, #120e0c); border:1px solid var(--line); border-radius:18px; padding:12px; text-align:center; }
  .card.dim { opacity:.4; }
  .card.plate { background:radial-gradient(circle at 50% 30%, #5a2430, #140e10 72%); }
  .frame { aspect-ratio:4/5; display:grid; place-items:center; }
  .frame img { width:86%; height:92%; object-fit:contain; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
  .chips span { border:1px solid var(--line); border-radius:999px; padding:3px 8px; font-size:11px; color:var(--muted); }
  .buy { margin:14px 0; padding:16px; border:1px solid var(--gold); border-radius:18px; background:#1a1012; }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; place-items:end center; z-index:5; }
  .sheet.on { display:grid; }
  .panel { width:min(460px, 100%); background:#171310; border-radius:18px 18px 0 0; padding:18px 18px 28px; }
  .panel input { width:100%; border-radius:12px; margin:8px 0; }
  .panel button, .panel a { display:block; width:100%; margin:8px 0; text-align:center; text-decoration:none; }
  @media (max-width:700px) { header { flex-direction:column; align-items:flex-start; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Oval <span>Room</span></h1>
    <div class="sub" id="status">Museum lobby</div>
  </div>
  <button id="connect" class="gold">Connect wallet</button>
</header>
<main>
  <div class="crest">OVAL</div>
  <p class="note" id="note">Look and play from anywhere. An oval opens the private rooms.</p>
  <div class="doors" id="doors"></div>
  <div class="filters" id="tools"></div>
  <div id="stage"></div>
</main>
<div class="sheet" id="sheet">
  <div class="panel">
    <p id="sheet-title">Connect</p>
    <div id="found"></div>
    <button id="use-here" class="gold">Use the wallet in this browser</button>
    <a id="link-rb" href="https://rainbow.me/dapp/ovals.vercel.app">Open in Rainbow</a>
    <a id="link-cb" href="https://go.cb-w.com/dapp?cb_url=https%3A%2F%2Fovals.vercel.app">Open in Coinbase Wallet</a>
    <a id="link-tw" href="https://link.trustwallet.com/open_url?coin_id=60&url=https%3A%2F%2Fovals.vercel.app">Open in Trust Wallet</a>
    <input id="addr" placeholder="Or paste wallet address, 0x…" autocapitalize="off" autocorrect="off" spellcheck="false" />
    <button id="use-addr">Enter with this address</button>
    <button id="close-sheet">Close</button>
    <p class="note" id="sheet-note"></p>
  </div>
</div>
<script>
const CONTRACT = "0xb8611673d94f3846c619e2a146b84e793f93f931";
const CHAIN = "0x1237";
const RPC = "https://rpc.mainnet.chain.robinhood.com";
const BUY = "https://opensea.io/collection/oval-room";
const ROOMS = [
  { id:"lobby", name:"Lobby", open:true, blurb:"Look" },
  { id:"play", name:"Play", open:true, blurb:"Guess the gaze" },
  { id:"hall", name:"Gold hall", open:true, blurb:"Public room" },
  { id:"plates", name:"Plate alcove", open:false, blurb:"Holders" },
  { id:"mine", name:"My wall", open:false, blurb:"Holders" },
  { id:"sitting", name:"Sitting", open:false, blurb:"Holders" }
];
const stage = document.getElementById("stage");
const note = document.getElementById("note");
const doors = document.getElementById("doors");
const tools = document.getElementById("tools");
let account = null, holder = false, held = [], room = "lobby", cache = new Map(), found = [];

function trait(nft, key) {
  const a = (nft.attributes || []).find(x => (x.trait_type || "").toLowerCase() === key.toLowerCase());
  return a ? String(a.value) : "";
}
function hexPad(n) { return Number(n).toString(16).padStart(64, "0"); }
function validAddress(v) { return /^0x[a-fA-F0-9]{40}$/.test((v || "").trim()); }
async function rpc(method, params) {
  const res = await fetch(RPC, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ jsonrpc:"2.0", id:1, method, params }) });
  const json = await res.json();
  if (json.error) throw new Error(json.error.message || "The chain did not answer.");
  return json.result;
}
function decodeAbiString(hex) {
  const h = hex.replace(/^0x/, "");
  const len = parseInt(h.slice(64, 128), 16);
  const bytes = h.slice(128, 128 + len * 2);
  let s = "";
  for (let i = 0; i < bytes.length; i += 2) s += String.fromCharCode(parseInt(bytes.slice(i, i + 2), 16));
  return s;
}
async function loadToken(id) {
  id = Number(id);
  if (!id) throw new Error("bad id");
  if (cache.has(id)) return cache.get(id);
  const result = await rpc("eth_call", [{ to:CONTRACT, data:"0xc87b56dd" + hexPad(id) }, "latest"]);
  const meta = JSON.parse(atob(decodeAbiString(result).split(",")[1]));
  const nft = { id, ...meta, method:trait(meta,"Method"), year:trait(meta,"Year"), gaze:trait(meta,"Gaze"), hair:trait(meta,"Hair"), epoch:trait(meta,"Epoch"), jewel:trait(meta,"Jewel") };
  cache.set(id, nft);
  return nft;
}
async function gather(ids) {
  const out = [];
  for (const id of ids) { try { out.push(await loadToken(id)); } catch (e) {} }
  return out;
}
async function balanceOf(address) {
  const data = "0x70a08231" + address.toLowerCase().replace("0x", "").padStart(64, "0");
  const result = await rpc("eth_call", [{ to:CONTRACT, data }, "latest"]);
  return parseInt(result, 16) || 0;
}
const MINT_BLOCK = 83602400;
async function heldIds(address) {
  const me = address.toLowerCase();
  const topicTo = "0x" + me.replace("0x", "").padStart(64, "0");
  const latest = parseInt(await rpc("eth_blockNumber", []), 16);
  const end = Math.min(latest, MINT_BLOCK + 50000);
  const logs = [];
  for (let b = MINT_BLOCK; b <= end; b += 2000) {
    const chunk = await rpc("eth_getLogs", [{
      address: CONTRACT,
      topics: ["0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"],
      fromBlock: "0x" + b.toString(16),
      toBlock: "0x" + Math.min(end, b + 1999).toString(16)
    }]);
    if (chunk && chunk.length) logs.push(...chunk);
  }
  logs.sort((a, c) => a.blockNumber === c.blockNumber ? a.logIndex.localeCompare(c.logIndex) : a.blockNumber.localeCompare(c.blockNumber));
  const qty = new Map();
  const own = new Map();
  for (const log of logs) {
    const from = "0x" + log.topics[1].slice(26);
    const to = "0x" + log.topics[2].slice(26);
    const id = parseInt(log.topics[3], 16);
    if (from === "0x0000000000000000000000000000000000000000") {
      let n = qty.get(log.transactionHash);
      if (n == null) {
        try {
          const tx = await rpc("eth_getTransactionByHash", [log.transactionHash]);
          n = parseInt(tx.input.slice(10, 74), 16) || 1;
        } catch { n = 1; }
        if (!n || n > 100) n = 1;
        qty.set(log.transactionHash, n);
      }
      for (let i = 0; i < n; i++) own.set(id + i, to);
    } else {
      own.set(id, to);
    }
  }
  return [...own.entries()].filter(([, who]) => who === me).map(([id]) => id).sort((a, b) => a - b);
}
function card(nft, dim) {
  const el = document.createElement("article");
  el.className = "card" + (dim ? " dim" : "") + (/plate/i.test(nft.method || "") ? " plate" : "");
  const chips = [nft.method, nft.epoch, nft.year, nft.gaze].filter(Boolean);
  el.innerHTML = `<div class="frame">${nft.image ? `<img alt="" src="${nft.image}">` : ""}</div>
    <div>${nft.name || ("#" + nft.id)}</div>
    <div class="chips">${chips.map(c => `<span>${c}</span>`).join("")}</div>
    <div class="meta"><a href="https://opensea.io/item/robinhood/${CONTRACT}/${nft.id}" target="_blank" rel="noreferrer">OpenSea</a></div>`;
  return el;
}
function buyBox(text) {
  return `<div class="buy"><strong>${text}</strong><p class="note">Mint is over. The sweep is on OpenSea.</p><p><a href="${BUY}" target="_blank" rel="noreferrer">Buy an Oval</a></p></div>`;
}
function paintDoors() {
  doors.innerHTML = "";
  ROOMS.forEach(r => {
    const locked = !r.open && !holder;
    const b = document.createElement("button");
    b.className = "doorbtn" + (room === r.id ? " on" : "");
    b.innerHTML = `${r.name}<small>${locked ? "Locked · buy an oval" : r.blurb}</small>`;
    b.onclick = () => { room = r.id; render(); };
    doors.appendChild(b);
  });
}
function arrange(list) {
  const sort = (document.getElementById("sort") || {}).value || "id";
  const focus = (document.getElementById("focus") || {}).value || "";
  return list.slice().sort((a, b) => sort === "year" ? Number(a.year || 0) - Number(b.year || 0) : sort === "method" ? String(a.method).localeCompare(String(b.method)) : a.id - b.id)
    .map(n => ({ n, dim: focus && n.epoch !== focus && n.method !== focus }));
}
function toolBar() {
  tools.innerHTML = holder ? `<select id="sort"><option value="id">Arrange by number</option><option value="year">Arrange by year</option><option value="method">Arrange by method</option></select>
    <select id="focus"><option value="">No spotlight</option><option>Pencil</option><option>Ink</option><option>Pixel</option><option>Plate</option><option>Gold Ground</option><option>Plaster</option></select>
    <input id="lookup" inputmode="numeric" placeholder="Token number"><button id="find">Look up</button><button id="share">Share sitting</button>` : "";
  const sort = document.getElementById("sort"), focus = document.getElementById("focus");
  if (sort) sort.onchange = render;
  if (focus) focus.onchange = render;
  const find = document.getElementById("find");
  if (find) find.onclick = async () => {
    const id = Number(document.getElementById("lookup").value);
    stage.innerHTML = "";
    try { stage.appendChild(card(await loadToken(id), false)); } catch { stage.innerHTML = "<p class='note'>No portrait at that number.</p>"; }
  };
  const share = document.getElementById("share");
  if (share) share.onclick = async () => {
    const url = location.origin + "/?sitting=" + (held.slice(0, 12).join(",") || "1");
    try { await navigator.clipboard.writeText(url); note.textContent = "Sitting link copied."; } catch { note.textContent = url; }
  };
}
async function enter(address, label) {
  account = address;
  localStorage.setItem("oval.address", address);
  document.getElementById("connect").textContent = label || (address.slice(0, 6) + "…" + address.slice(-4));
  document.getElementById("sheet").classList.remove("on");
  note.textContent = "Reading " + count + " oval" + (count === 1 ? "" : "s") + " from the mint record.";
  let count = 0;
  try { count = await balanceOf(address); } catch (err) { note.textContent = err.message; }
  holder = count > 0;
  try { held = await heldIds(address); } catch { held = []; }
  if (holder && !held.length) note.textContent = "You hold " + count + ". The wall is still catching up. Look one up by number.";
  else if (holder) note.textContent = "You hold " + count + ".";
  room = holder ? "mine" : "lobby";
  render();
}
async function render() {
  paintDoors();
  toolBar();
  document.getElementById("status").textContent = holder ? "Holder · rooms open" : account ? "Visitor · private rooms locked" : "Museum lobby";
  if ((room === "plates" || room === "mine" || room === "sitting") && !holder) {
    note.textContent = "That door opens for oval holders.";
    stage.innerHTML = buyBox("This room is for holders.");
    return;
  }
  if (room === "lobby") {
    note.textContent = holder ? "The house is open." : "Walk the lobby. Play if you like. An oval opens the rest.";
    stage.className = "wall";
    stage.innerHTML = holder ? "" : buyBox("Hold an oval to open your wall, the plate alcove, and the sitting.");
    (arrange(await gather([1, 2, 3, 4, 8, 20]))).forEach(x => stage.appendChild(card(x.n, x.dim)));
    return;
  }
  if (room === "play") {
    note.textContent = "Name the gaze.";
    const nft = await loadToken(4);
    stage.innerHTML = "";
    stage.appendChild(card(nft, false));
    const box = document.createElement("div");
    box.className = "buy";
    box.innerHTML = "<strong>Which way is she looking?</strong>";
    ["Aside", "Down", "Direct", "Past you"].forEach(g => {
      const b = document.createElement("button");
      b.textContent = g;
      b.onclick = () => box.insertAdjacentHTML("beforeend", g === nft.gaze ? "<p>Yes. That gaze.</p>" : "<p class='note'>Not that one.</p>");
      box.appendChild(b);
    });
    if (!holder) box.insertAdjacentHTML("beforeend", `<p><a href="${BUY}">Buy an Oval to open the rooms</a></p>`);
    stage.appendChild(box);
    return;
  }
  if (room === "hall") {
    note.textContent = "The public hall.";
    stage.className = "wall";
    stage.innerHTML = "";
    (arrange(await gather([1, 2, 3, 4, 8, 15, 20]))).forEach(x => stage.appendChild(card(x.n, x.dim)));
    return;
  }
  if (room === "plates") {
    note.textContent = "Plate alcove.";
    const list = (await gather(held.concat([64, 96, 128]))).filter(n => /plate/i.test(n.method || ""));
    stage.className = "wall";
    stage.innerHTML = list.length ? "" : "<p class='note'>No plate in this stretch. Look one up by number.</p>";
    list.forEach(n => stage.appendChild(card(n, false)));
    return;
  }
  note.textContent = room === "sitting" ? "Your sitting." : "Your wall.";
  const list = arrange(await gather(held.slice(0, 48)));
  stage.className = "wall";
  stage.innerHTML = list.length ? "" : buyBox("No ovals found on this address yet.");
  list.forEach(x => stage.appendChild(card(x.n, x.dim)));
}
async function connectInjected(eth) {
  const id = await eth.request({ method:"eth_chainId" });
  if (id !== CHAIN) {
    try { await eth.request({ method:"wallet_switchEthereumChain", params:[{ chainId:CHAIN }] }); }
    catch (err) {
      if (err.code === 4902) {
        await eth.request({ method:"wallet_addEthereumChain", params:[{ chainId:CHAIN, chainName:"Robinhood Chain", nativeCurrency:{ name:"Ether", symbol:"ETH", decimals:18 }, rpcUrls:[RPC], blockExplorerUrls:["https://robinhoodchain.blockscout.com"] }] });
      } else throw err;
    }
  }
  const accounts = await eth.request({ method:"eth_requestAccounts" });
  if (!accounts || !accounts[0]) throw new Error("The wallet returned no account.");
  await enter(accounts[0], accounts[0].slice(0, 6) + "…" + accounts[0].slice(-4));
}
function isPhone() { return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent); }
function discovered() {
  const list = found.slice();
  const eth = window.ethereum;
  if (eth && eth.providers) eth.providers.forEach(p => { if (!list.includes(p)) list.push(p); });
  else if (eth && !list.includes(eth)) list.push(eth);
  return list;
}
window.addEventListener("eip6963:announceProvider", (event) => {
  const p = event.detail && event.detail.provider;
  const name = event.detail && event.detail.info && event.detail.info.name;
  if (p && !found.includes(p)) { p._ovalName = name; found.push(p); }
});
window.dispatchEvent(new Event("eip6963:requestProvider"));
function loadMetaMask() {
  return new Promise((resolve, reject) => {
    if (window.MetaMaskSDK) return resolve(window.MetaMaskSDK);
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@metamask/sdk@0.33.1/dist/browser/umd/metamask-sdk.js";
    s.onload = () => resolve(window.MetaMaskSDK);
    s.onerror = () => reject(new Error("MetaMask did not load."));
    document.head.appendChild(s);
  });
}
document.getElementById("connect").onclick = () => {
  document.getElementById("sheet").classList.add("on");
  const phone = isPhone();
  const list = discovered();
  document.getElementById("sheet-title").textContent = phone ? "Open your wallet app" : "Connect on this computer";
  const box = document.getElementById("found");
  box.innerHTML = "";
  list.forEach((p) => {
    const b = document.createElement("button");
    b.className = "gold";
    b.textContent = p._ovalName || "Wallet in this browser";
    b.onclick = () => connectInjected(p).catch(err => document.getElementById("sheet-note").textContent = err.message || "Connection refused.");
    box.appendChild(b);
  });
  document.getElementById("use-here").style.display = list.length ? "none" : "block";
  document.getElementById("use-here").textContent = phone ? "Try wallet in this browser" : "Use MetaMask on this computer";
  document.getElementById("sheet-note").textContent = phone
    ? "On a phone, open ovals.vercel.app inside Rainbow, Coinbase, or Trust. MetaMask flags the jump link. Paste an address if you only want the rooms."
    : (list.length ? "Pick the wallet in this browser." : "Install a wallet, or paste an address to look.");
};
document.getElementById("close-sheet").onclick = () => document.getElementById("sheet").classList.remove("on");
document.getElementById("use-here").onclick = async () => {
  const list = discovered();
  if (list.length) {
    try { await connectInjected(list[0]); } catch (err) { document.getElementById("sheet-note").textContent = err.message || "Connection refused."; }
    return;
  }
  if (isPhone()) { document.getElementById("sheet-note").textContent = "Open ovals.vercel.app inside Rainbow, Coinbase, or Trust. MetaMask flags the jump link."; return; }
  document.getElementById("sheet-note").textContent = "Opening MetaMask.";
  try {
    const SDK = await loadMetaMask();
    const MetaMaskSDK = SDK.MetaMaskSDK || SDK;
    const sdk = new MetaMaskSDK({ dappMetadata:{ name:"Oval Room", url:"https://ovals.vercel.app" }, preferDesktop:true, checkInstallationImmediately:false });
    await sdk.init();
    await connectInjected(sdk.getProvider());
  } catch (err) {
    document.getElementById("sheet-note").textContent = "No wallet here. Paste an address, or open the page in MetaMask.";
  }
};
document.getElementById("use-addr").onclick = async () => {
  const address = document.getElementById("addr").value.trim();
  if (!validAddress(address)) { document.getElementById("sheet-note").textContent = "Paste the full address, starting with 0x."; return; }
  await enter(address);
};
const saved = localStorage.getItem("oval.address");
const sitting = new URLSearchParams(location.search).get("sitting");
if (sitting) {
  gather(sitting.split(",").map(Number).filter(Boolean)).then(list => {
    note.textContent = "A shared sitting.";
    stage.className = "wall";
    list.forEach(n => stage.appendChild(card(n, false)));
  });
} else if (saved && validAddress(saved)) enter(saved);
else render();
</script>
</body>
</html>
