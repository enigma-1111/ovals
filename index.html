<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Oval Room</title>
<meta name="description" content="Walk the Oval Room." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='11' ry='14' fill='none' stroke='%23c6a15b' stroke-width='2'/%3E%3C/svg%3E" />
<style>
  html, body { margin:0; height:100%; background:#070605; color:#efe4d2; font:14px/1.3 Palatino, Georgia, serif; overflow:hidden; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:fixed; inset:0; pointer-events:none; }
  #hud button, #hud input, #hud a { pointer-events:auto; font:13px/1 Palatino, Georgia, serif; color:#efe4d2; background:rgba(10,8,7,.55); border:1px solid rgba(201,161,90,.45); border-radius:999px; padding:8px 12px; text-decoration:none; }
  h1 { position:fixed; top:14px; left:16px; margin:0; letter-spacing:.28em; font-size:11px; color:#c9a15a; }
  #connect { position:fixed; top:10px; right:12px; }
  #plaque { position:fixed; left:50%; bottom:92px; transform:translateX(-50%); min-width:160px; text-align:center; background:#d9c7a2; color:#2b2116; padding:8px 12px; display:none; }
  #plaque b { display:block; }
  .pad { position:fixed; left:14px; bottom:18px; display:grid; grid-template-columns:44px 44px 44px; gap:6px; }
  .pad button { width:44px; height:44px; border-radius:10px; }
  .look { position:fixed; right:14px; bottom:18px; width:92px; height:92px; border-radius:50%; border:1px solid rgba(201,161,90,.4); }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; place-items:end center; pointer-events:auto; }
  .sheet.on { display:grid; }
  .panel { width:min(440px,100%); background:#1a120f; padding:18px 18px 28px; border-radius:18px 18px 0 0; }
  .panel button, .panel a, .panel input { display:block; width:100%; margin:8px 0; text-align:center; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<h1>OVAL ROOM</h1>
<button id="connect">Enter</button>
<div id="plaque"></div>
<div class="pad">
  <span></span><button id="up">↑</button><span></span>
  <button id="left">←</button><button id="down">↓</button><button id="right">→</button>
</div>
<div class="sheet" id="sheet">
  <div class="panel">
    <p>The desk</p>
    <button id="use-here">Wallet in this browser</button>
    <a href="https://rainbow.me/dapp/ovals.vercel.app">Rainbow</a>
    <a href="https://go.cb-w.com/dapp?cb_url=https%3A%2F%2Fovals.vercel.app">Coinbase Wallet</a>
    <a href="https://link.trustwallet.com/open_url?coin_id=60&url=https%3A%2F%2Fovals.vercel.app">Trust Wallet</a>
    <input id="addr" placeholder="Paste 0x address" autocapitalize="off" spellcheck="false" />
    <button id="use-addr">Check this address</button>
    <button id="close-sheet">Step back</button>
    <p id="sheet-note"></p>
  </div>
</div>
<script type="module">
import * as THREE from "three";
const CONTRACT = "0xb8611673d94f3846c619e2a146b84e793f93f931";
const CHAIN = "0x1237";
const RPC = "https://rpc.mainnet.chain.robinhood.com";
const BUY = "https://opensea.io/collection/oval-room";
const MINT_BLOCK = 83602400;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070605);
scene.fog = new THREE.Fog(0x070605, 18, 62);
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 120);
camera.position.set(0, 1.6, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x665544, 0.55));
const sun = new THREE.PointLight(0xffe2b0, 0.6, 30);
sun.position.set(0, 4, 10);
scene.add(sun);
function box(w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
  scene.add(m);
  return m;
}
box(14, 0.2, 70, 0x1a140f).position.set(0, 0, -8);
box(14, 0.15, 70, 0x11100e).position.set(0, 5.2, -8);
for (let i = -6; i <= 6; i++) box(0.04, 0.04, 70, 0x2a2622).position.set(i, 5.12, -8);
for (let z = 20; z >= -40; z -= 4) box(14, 0.03, 0.03, 0x2a2622).position.set(0, 5.12, z);
box(0.3, 5, 70, 0x120e0c).position.set(-7, 2.5, -8);
box(0.3, 5, 70, 0x120e0c).position.set(7, 2.5, -8);
box(14, 5, 0.3, 0x120e0c).position.set(0, 2.5, -42);
for (let z = 8; z >= -28; z -= 12) {
  const b = box(1.6, 0.12, 0.45, 0x3a2a20);
  b.position.set(0, 0.42, z);
  box(0.12, 0.4, 0.12, 0x2a1c14).position.set(-0.6, 0.2, z);
  box(0.12, 0.4, 0.12, 0x2a1c14).position.set(0.6, 0.2, z);
}
const frames = [];
const loader = new THREE.TextureLoader();
loader.setCrossOrigin("anonymous");
function hexPad(n) { return Number(n).toString(16).padStart(64, "0"); }
async function rpc(method, params) {
  const res = await fetch(RPC, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ jsonrpc:"2.0", id:1, method, params }) });
  const json = await res.json();
  if (json.error) throw new Error(json.error.message || "The chain did not answer.");
  return json.result;
}
function decodeAbiString(hex) {
  const h = hex.replace(/^0x/, "");
  const len = parseInt(h.slice(64, 128), 16);
  const bytes = h.slice(128, 128 + len * 2);
  let s = "";
  for (let i = 0; i < bytes.length; i += 2) s += String.fromCharCode(parseInt(bytes.slice(i, i + 2), 16));
  return s;
}
async function loadToken(id) {
  const meta = JSON.parse(atob(decodeAbiString(await rpc("eth_call", [{ to:CONTRACT, data:"0xc87b56dd" + hexPad(id) }, "latest"])).split(",")[1]));
  const attr = (k) => { const a = (meta.attributes || []).find(x => (x.trait_type || "").toLowerCase() === k); return a ? String(a.value) : ""; };
  return { id, name: meta.name, image: meta.image, method: attr("method"), year: attr("year") };
}
function hang(nft, x, z, rot) {
  const g = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.BoxGeometry(1.7, 2.15, 0.08), new THREE.MeshLambertMaterial({ color: 0xb08a45 }));
  const mat = new THREE.MeshBasicMaterial({ color: 0x1a140f });
  const art = new THREE.Mesh(new THREE.PlaneGeometry(1.35, 1.75), mat);
  art.position.z = 0.05;
  g.add(frame, art);
  g.position.set(x, 2.15, z);
  g.rotation.y = rot;
  scene.add(g);
  const spot = new THREE.SpotLight(0xffe6c0, 1.4, 8, 0.5, 0.4);
  spot.position.set(x, 4.4, z);
  spot.target.position.set(x, 2.1, z);
  scene.add(spot, spot.target);
  frames.push({ mesh: art, nft });
  if (nft.image) loader.load(nft.image, (tex) => { mat.map = tex; mat.needsUpdate = true; });
}
const keys = {};
addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
let yaw = Math.PI, lookX = 0, lookY = 0;
renderer.domElement.addEventListener("pointerdown", (e) => { if (e.clientX > innerWidth * 0.45) renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener("pointermove", (e) => {
  if (e.buttons && e.clientX > innerWidth * 0.4) { yaw -= e.movementX * 0.004; lookY = Math.max(-0.4, Math.min(0.4, lookY - e.movementY * 0.003)); }
});
function hold(id, code) {
  const b = document.getElementById(id);
  const on = () => keys[code] = true;
  const off = () => keys[code] = false;
  b.addEventListener("pointerdown", on);
  b.addEventListener("pointerup", off);
  b.addEventListener("pointerleave", off);
}
hold("up", "w"); hold("down", "s"); hold("left", "a"); hold("right", "d");
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener("click", (e) => {
  const x = (e.clientX / innerWidth) * 2 - 1;
  const y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera({ x, y }, camera);
  const hit = ray.intersectObjects(frames.map(f => f.mesh))[0];
  const box = document.getElementById("plaque");
  if (!hit) { box.style.display = "none"; return; }
  const nft = frames.find(f => f.mesh === hit.object).nft;
  box.style.display = "block";
  box.innerHTML = `<b>${nft.name || ("Oval " + nft.id)}</b>${[nft.method, nft.year].filter(Boolean).join(" · ")}`;
});
let holder = false, held = [];
async function fill(ids, side, start) {
  for (let i = 0; i < ids.length; i++) {
    try {
      const nft = await loadToken(ids[i]);
      const z = start - i * 5;
      hang(nft, side, z, side > 0 ? -Math.PI / 2 : Math.PI / 2);
    } catch (e) {}
  }
}
fill([1,2,3,4,5,6,7,8], -6.7, 14);
fill([9,10,11,12,13,14,15,16], 6.7, 14);
function validAddress(v) { return /^0x[a-fA-F0-9]{40}$/.test((v || "").trim()); }
async function balanceOf(address) { return parseInt(await rpc("eth_call", [{ to:CONTRACT, data:"0x70a08231" + address.toLowerCase().replace("0x","").padStart(64,"0") }, "latest"]), 16) || 0; }
async function heldIds(address) {
  const me = address.toLowerCase();
  const latest = parseInt(await rpc("eth_blockNumber", []), 16);
  const end = Math.min(latest, MINT_BLOCK + 20000);
  const logs = [];
  for (let b = MINT_BLOCK; b <= end; b += 5000) {
    const chunk = await rpc("eth_getLogs", [{ address:CONTRACT, topics:["0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"], fromBlock:"0x"+b.toString(16), toBlock:"0x"+Math.min(end, b+4999).toString(16) }]);
    if (chunk && chunk.length) logs.push(...chunk);
  }
  const qty = new Map(), own = new Map();
  for (const log of logs) {
    const from = "0x" + log.topics[1].slice(26), to = "0x" + log.topics[2].slice(26), id = parseInt(log.topics[3], 16);
    if (from === "0x0000000000000000000000000000000000000000") {
      let n = qty.get(log.transactionHash);
      if (n == null) { try { n = parseInt((await rpc("eth_getTransactionByHash", [log.transactionHash])).input.slice(10, 74), 16) || 1; } catch { n = 1; } if (!n || n > 100) n = 1; qty.set(log.transactionHash, n); }
      for (let i = 0; i < n; i++) own.set(id + i, to);
    } else own.set(id, to);
  }
  return [...own.entries()].filter(([, who]) => who === me).map(([id]) => id);
}
async function enter(address) {
  localStorage.setItem("oval.address", address);
  document.getElementById("connect").textContent = address.slice(0,6) + "…" + address.slice(-4);
  document.getElementById("sheet").classList.remove("on");
  const count = await balanceOf(address).catch(() => 0);
  holder = count > 0;
  if (!holder) { document.getElementById("plaque").style.display = "block"; document.getElementById("plaque").innerHTML = `No oval here. <a href="${BUY}">Acquire one</a>`; return; }
  held = await heldIds(address).catch(() => []);
  box(8, 5, 0.2, 0x1a120f).position.set(0, 2.5, -42);
  fill(held.slice(0, 8), 6.7, -8);
}
function discovered() { const eth = window.ethereum; return eth && eth.providers ? eth.providers : eth ? [eth] : []; }
async function connectInjected(eth) {
  if (await eth.request({ method:"eth_chainId" }) !== CHAIN) {
    try { await eth.request({ method:"wallet_switchEthereumChain", params:[{ chainId:CHAIN }] }); }
    catch (err) { if (err.code === 4902) await eth.request({ method:"wallet_addEthereumChain", params:[{ chainId:CHAIN, chainName:"Robinhood Chain", nativeCurrency:{ name:"Ether", symbol:"ETH", decimals:18 }, rpcUrls:[RPC], blockExplorerUrls:["https://robinhoodchain.blockscout.com"] }] }); else throw err; }
  }
  await enter((await eth.request({ method:"eth_requestAccounts" }))[0]);
}
document.getElementById("connect").onclick = () => document.getElementById("sheet").classList.add("on");
document.getElementById("close-sheet").onclick = () => document.getElementById("sheet").classList.remove("on");
document.getElementById("use-here").onclick = async () => { const list = discovered(); if (!list[0]) { document.getElementById("sheet-note").textContent = "No wallet in this browser."; return; } try { await connectInjected(list[0]); } catch (err) { document.getElementById("sheet-note").textContent = err.message || "Refused."; } };
document.getElementById("use-addr").onclick = async () => { const address = document.getElementById("addr").value.trim(); if (!validAddress(address)) { document.getElementById("sheet-note").textContent = "Paste the full 0x address."; return; } await enter(address); };
const saved = localStorage.getItem("oval.address");
if (saved && validAddress(saved)) enter(saved);
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const speed = 6 * dt;
  const dir = new THREE.Vector3();
  if (keys.w || keys.arrowup) dir.z -= 1;
  if (keys.s || keys.arrowdown) dir.z += 1;
  if (keys.a || keys.arrowleft) dir.x -= 1;
  if (keys.d || keys.arrowright) dir.x += 1;
  if (dir.length()) {
    dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    camera.position.addScaledVector(dir, speed);
  }
  camera.position.x = Math.max(-5.5, Math.min(5.5, camera.position.x));
  camera.position.z = Math.max(-40, Math.min(22, camera.position.z));
  camera.position.y = 1.6;
  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = lookY;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
tick();
</script>
</body>
</html>
