<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oval Room</title>
<meta name="description" content="Oval Room museum. Holders enter. Visitors may look, play, and buy." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='11' ry='14' fill='none' stroke='%23c6a15b' stroke-width='2'/%3E%3C/svg%3E" />
<style>
  :root { --bg:#0e0b09; --line:#3a2e24; --gold:#c6a15b; --paper:#e7dcc8; --ink:#1c140e; --muted:#a89884; --velvet:#3b1820; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--paper); font:16px/1.45 Georgia, "Iowan Old Style", serif; background:#0e0b09; }
  .lobby { min-height:100vh; background:radial-gradient(900px 480px at 50% 0%, #3a241c, #0e0b09 62%); }
  header { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:22px 6vw 8px; }
  h1 { margin:0; font-size:15px; letter-spacing:.2em; font-weight:500; text-transform:uppercase; }
  h1 span, a { color:var(--gold); }
  .sub, .note, .meta { color:var(--muted); }
  button, select, input { font:14px/1 Georgia, serif; color:var(--paper); background:transparent; border:1px solid var(--line); border-radius:999px; padding:8px 14px; }
  button { cursor:pointer; }
  button.gold { border-color:var(--gold); color:var(--gold); }
  button.on { background:var(--paper); color:var(--ink); }
  main { padding:8px 6vw 72px; }
  .crest { width:88px; height:112px; margin:18px auto 8px; border:2px solid var(--gold); border-radius:50%; display:grid; place-items:center; color:var(--gold); letter-spacing:.14em; font-size:11px; }
  .doors { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; margin:18px 0; }
  .doorbtn { border-radius:18px; min-height:92px; background:linear-gradient(#2a1c18, #140f0d); text-align:left; }
  .doorbtn small { display:block; color:var(--muted); margin-top:6px; }
  .doorbtn.locked { opacity:.72; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 18px; }
  .wall { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:18px; }
  .card { background:linear-gradient(#241c17, #120e0c); border:1px solid var(--line); border-radius:18px; padding:12px; text-align:center; }
  .card.dim { opacity:.38; }
  .card.plate { background:radial-gradient(circle at 50% 30%, #5a2430, #140e10 72%); }
  .frame { aspect-ratio:4/5; display:grid; place-items:center; }
  .frame img, .frame svg { width:86%; height:92%; object-fit:contain; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
  .chips span { border:1px solid var(--line); border-radius:999px; padding:3px 8px; font-size:11px; color:var(--muted); }
  .buy { margin:18px 0; padding:18px; border:1px solid var(--gold); border-radius:18px; background:#1a1012; }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; place-items:end center; }
  .sheet.on { display:grid; }
  .panel { width:min(440px, 100%); background:#171310; border-radius:18px 18px 0 0; padding:18px; }
  .panel button, .panel a { display:block; width:100%; margin:8px 0; text-align:center; text-decoration:none; }
  @media (max-width:700px) { header { flex-direction:column; align-items:flex-start; } }
</style>
</head>
<body class="lobby">
<header>
  <div>
    <h1>Oval <span>Room</span></h1>
    <div class="sub" id="status">Museum lobby · Robinhood Chain</div>
  </div>
  <button id="connect" class="gold">Connect wallet</button>
</header>
<main>
  <div class="crest">OVAL</div>
  <p class="note" id="note">Visitors may walk the lobby and play. An oval opens the private rooms.</p>
  <div class="doors" id="doors"></div>
  <div class="filters" id="tools"></div>
  <div id="stage"></div>
</main>
<div class="sheet" id="sheet">
  <div class="panel">
    <p>Connect on Robinhood Chain.</p>
    <button id="use-wallet">Use this browser wallet</button>
    <a class="gold" id="mm" href="https://metamask.app.link/dapp/ovals.vercel.app">Open in MetaMask</a>
    <a class="gold" href="https://rainbow.me/dapp/ovals.vercel.app">Open in Rainbow</a>
    <a class="gold" href="https://go.cb-w.com/dapp?cb_url=https%3A%2F%2Fovals.vercel.app">Open in Coinbase Wallet</a>
    <button id="close-sheet">Close</button>
  </div>
</div>
<script>
const CONTRACT = "0xb8611673d94f3846c619e2a146b84e793f93f931";
const CHAIN = "0x1237";
const RPC = "https://rpc.mainnet.chain.robinhood.com";
const BUY = "https://opensea.io/collection/oval-room";
const ROOMS = [
  { id:"lobby", name:"Lobby", open:true, blurb:"Look" },
  { id:"play", name:"Play", open:true, blurb:"Guess the gaze" },
  { id:"hall", name:"Gold hall", open:true, blurb:"One public room" },
  { id:"plates", name:"Plate alcove", open:false, blurb:"Holders" },
  { id:"mine", name:"My wall", open:false, blurb:"Holders" },
  { id:"sitting", name:"Sitting", open:false, blurb:"Holders" }
];
const stage = document.getElementById("stage");
const note = document.getElementById("note");
const doors = document.getElementById("doors");
const tools = document.getElementById("tools");
let account = null, holder = false, held = [], room = "lobby", cache = new Map(), provider = null;

function providerList() {
  const eth = window.ethereum;
  if (!eth) return [];
  if (eth.providers && eth.providers.length) return eth.providers;
  return [eth];
}
function trait(nft, key) {
  const a = (nft.attributes || []).find(x => (x.trait_type || "").toLowerCase() === key.toLowerCase());
  return a ? String(a.value) : "";
}
function hexPad(n) { return Number(n).toString(16).padStart(64, "0"); }
async function rpc(method, params) {
  const res = await fetch(RPC, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ jsonrpc:"2.0", id:1, method, params }) });
  const json = await res.json();
  if (json.error) throw new Error(json.error.message || "rpc");
  return json.result;
}
function decodeAbiString(hex) {
  const h = hex.replace(/^0x/, "");
  const len = parseInt(h.slice(64, 128), 16);
  const bytes = h.slice(128, 128 + len * 2);
  let s = "";
  for (let i = 0; i < bytes.length; i += 2) s += String.fromCharCode(parseInt(bytes.slice(i, i + 2), 16));
  return s;
}
async function loadToken(id) {
  id = Number(id);
  if (cache.has(id)) return cache.get(id);
  const result = await rpc("eth_call", [{ to:CONTRACT, data:"0xc87b56dd" + hexPad(id) }, "latest"]);
  const raw = decodeAbiString(result);
  const meta = JSON.parse(atob(raw.split(",")[1]));
  const nft = { id, ...meta, method:trait(meta,"Method"), year:trait(meta,"Year"), gaze:trait(meta,"Gaze"), hair:trait(meta,"Hair"), epoch:trait(meta,"Epoch"), jewel:trait(meta,"Jewel") };
  cache.set(id, nft);
  return nft;
}
async function gather(ids) {
  const out = [];
  for (const id of ids) { try { out.push(await loadToken(id)); } catch (e) {} }
  return out;
}
function card(nft, dim) {
  const el = document.createElement("article");
  el.className = "card" + (dim ? " dim" : "") + (/plate/i.test(nft.method || "") ? " plate" : "");
  const chips = [nft.method, nft.epoch, nft.year, nft.gaze].filter(Boolean);
  el.innerHTML = `<div class="frame">${nft.image ? `<img alt="" src="${nft.image}">` : ""}</div>
    <div>${nft.name || ("#" + nft.id)}</div>
    <div class="chips">${chips.map(c => `<span>${c}</span>`).join("")}</div>
    <div class="meta"><a href="https://opensea.io/item/robinhood/${CONTRACT}/${nft.id}" target="_blank" rel="noreferrer">OpenSea</a></div>`;
  return el;
}
function buyBox(text) {
  return `<div class="buy"><strong>${text}</strong><p class="note">The mint is over. Sweeps are on OpenSea.</p><p><a href="${BUY}" target="_blank" rel="noreferrer">Buy an Oval</a></p></div>`;
}
function paintDoors() {
  doors.innerHTML = "";
  ROOMS.forEach(r => {
    const locked = !r.open && !holder;
    const b = document.createElement("button");
    b.className = "doorbtn" + (room === r.id ? " on" : "") + (locked ? " locked" : "");
    b.innerHTML = `${r.name}<small>${locked ? "Locked · buy an oval" : r.blurb}</small>`;
    b.onclick = () => { room = r.id; render(); };
    doors.appendChild(b);
  });
}
function arrange(list) {
  const sort = (document.getElementById("sort") || {}).value || "id";
  const focus = (document.getElementById("focus") || {}).value || "";
  const copy = list.slice();
  copy.sort((a, b) => sort === "year" ? Number(a.year || 0) - Number(b.year || 0) : sort === "method" ? String(a.method).localeCompare(String(b.method)) : a.id - b.id);
  return copy.map(n => ({ n, dim: focus && n.epoch !== focus && n.method !== focus }));
}
function toolBar() {
  tools.innerHTML = holder ? `<select id="sort"><option value="id">Arrange by number</option><option value="year">Arrange by year</option><option value="method">Arrange by method</option></select>
    <select id="focus"><option value="">No spotlight</option><option>Pencil</option><option>Ink</option><option>Pixel</option><option>Plate</option><option>Gold Ground</option><option>Plaster</option></select>
    <input id="lookup" inputmode="numeric" placeholder="Token number"><button id="find">Look up</button><button id="share">Share sitting</button>` : "";
  const sort = document.getElementById("sort");
  const focus = document.getElementById("focus");
  if (sort) sort.onchange = render;
  if (focus) focus.onchange = render;
  const find = document.getElementById("find");
  if (find) find.onclick = async () => {
    const id = Number(document.getElementById("lookup").value);
    if (!id) return;
    stage.innerHTML = "";
    try { stage.appendChild(card(await loadToken(id), false)); } catch { stage.innerHTML = "<p class='note'>No portrait at that number.</p>"; }
  };
  const share = document.getElementById("share");
  if (share) share.onclick = async () => {
    const url = location.origin + "/?sitting=" + (held.slice(0, 12).join(",") || "1");
    try { await navigator.clipboard.writeText(url); note.textContent = "Sitting link copied."; } catch { note.textContent = url; }
  };
}
async function heldIds(address) {
  const topic = "0x" + address.toLowerCase().replace("0x", "").padStart(64, "0");
  const logs = await rpc("eth_getLogs", [{ address:CONTRACT, topics:["0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef", null, topic], fromBlock:"0x0", toBlock:"latest" }]);
  const ids = [...new Set(logs.map(l => parseInt(l.topics[3], 16)))];
  const mine = [];
  for (const id of ids) {
    const owner = await rpc("eth_call", [{ to:CONTRACT, data:"0x6352211e" + hexPad(id) }, "latest"]);
    if (owner && owner.toLowerCase().endsWith(address.toLowerCase().replace("0x", ""))) mine.push(id);
  }
  return mine;
}
async function render() {
  paintDoors();
  toolBar();
  document.getElementById("status").textContent = holder ? "Holder · private rooms open" : account ? "Visitor · private rooms locked" : "Museum lobby · Robinhood Chain";
  if ((room === "plates" || room === "mine" || room === "sitting") && !holder) {
    note.textContent = "That door opens for oval holders.";
    stage.innerHTML = buyBox("This room is for holders.");
    return;
  }
  if (room === "lobby") {
    note.textContent = holder ? "The house is open." : "Walk the lobby. Play if you like. An oval opens the rest.";
    const list = arrange(await gather([1, 2, 3, 4, 8, 20]));
    stage.className = "wall";
    stage.innerHTML = holder ? "" : buyBox("Hold an oval to open your wall, the plate alcove, and the sitting.");
    list.forEach(x => stage.appendChild(card(x.n, x.dim)));
    return;
  }
  if (room === "play") {
    note.textContent = "Visitor play. Name the gaze.";
    const nft = await loadToken(4);
    stage.innerHTML = "";
    stage.appendChild(card(nft, false));
    const box = document.createElement("div");
    box.className = "buy";
    box.innerHTML = "<strong>Which way is she looking?</strong>";
    ["Aside", "Down", "Direct", "Past you"].forEach(g => {
      const b = document.createElement("button");
      b.textContent = g;
      b.onclick = () => { box.insertAdjacentHTML("beforeend", g === nft.gaze ? "<p>Yes. That gaze.</p>" : "<p class='note'>Not that one.</p>"); };
      box.appendChild(b);
    });
    if (!holder) box.insertAdjacentHTML("beforeend", `<p><a href="${BUY}" target="_blank" rel="noreferrer">Buy an Oval to open the rooms</a></p>`);
    stage.appendChild(box);
    return;
  }
  if (room === "hall") {
    note.textContent = "The public hall. Other epochs stay in the private rooms.";
    const list = arrange(await gather([1, 2, 3, 4, 8, 15, 20]));
    stage.className = "wall";
    stage.innerHTML = "";
    list.forEach(x => stage.appendChild(card(x.n, x.dim)));
    return;
  }
  if (room === "plates") {
    note.textContent = "Plate alcove.";
    const list = (await gather(held.concat([1, 8, 20, 40, 64, 96]))).filter(n => /plate/i.test(n.method || ""));
    stage.className = "wall";
    stage.innerHTML = list.length ? "" : "<p class='note'>No plate in this stretch. Look one up by number.</p>";
    list.forEach(n => stage.appendChild(card(n, false)));
    return;
  }
  note.textContent = room === "sitting" ? "Your sitting." : "Your wall.";
  const list = arrange(await gather(held.slice(0, 48)));
  stage.className = "wall";
  stage.innerHTML = list.length ? "" : "<p class='note'>No ovals on this wallet.</p>";
  list.forEach(x => stage.appendChild(card(x.n, x.dim)));
}
async function ensureChain() {
  const id = await provider.request({ method:"eth_chainId" });
  if (id === CHAIN) return;
  try { await provider.request({ method:"wallet_switchEthereumChain", params:[{ chainId:CHAIN }] }); }
  catch (err) {
    if (err.code === 4902 || (err.data && err.data.originalError && err.data.originalError.code === 4902)) {
      await provider.request({ method:"wallet_addEthereumChain", params:[{ chainId:CHAIN, chainName:"Robinhood Chain", nativeCurrency:{ name:"Ether", symbol:"ETH", decimals:18 }, rpcUrls:[RPC], blockExplorerUrls:["https://robinhoodchain.blockscout.com"] }] });
    } else throw err;
  }
}
async function finishConnect(accounts) {
  account = accounts && accounts[0];
  if (!account) { note.textContent = "The wallet did not return an account."; return; }
  document.getElementById("connect").textContent = account.slice(0, 6) + "…" + account.slice(-4);
  document.getElementById("sheet").classList.remove("on");
  note.textContent = "Checking this wallet for an oval.";
  try { held = await heldIds(account); } catch (err) { held = []; note.textContent = "Could not read holdings yet. " + err.message; }
  holder = held.length > 0;
  room = holder ? "mine" : "lobby";
  render();
}
document.getElementById("connect").onclick = () => {
  const list = providerList();
  if (!list.length) { document.getElementById("sheet").classList.add("on"); return; }
  document.getElementById("sheet").classList.add("on");
  document.getElementById("use-wallet").textContent = list.length > 1 ? "Use browser wallet (" + list.length + ")" : "Use this browser wallet";
};
document.getElementById("close-sheet").onclick = () => document.getElementById("sheet").classList.remove("on");
document.getElementById("use-wallet").onclick = async () => {
  const list = providerList();
  provider = list[0];
  if (!provider) { note.textContent = "No wallet in this browser. Open the site inside MetaMask or Rainbow."; return; }
  try {
    await ensureChain();
    const accounts = await provider.request({ method:"eth_requestAccounts" });
    await finishConnect(accounts);
  } catch (err) {
    note.textContent = err && err.message ? err.message : "Wallet connection was refused.";
  }
};
const sitting = new URLSearchParams(location.search).get("sitting");
if (sitting) {
  room = "sitting";
  gather(sitting.split(",").map(Number).filter(Boolean)).then(list => {
    note.textContent = "A shared sitting.";
    stage.className = "wall";
    list.forEach(n => stage.appendChild(card(n, false)));
  });
}
render();
</script>
</body>
</html>
