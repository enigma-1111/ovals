<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oval Room</title>
<meta name="description" content="Oval Room museum. Holders enter. Visitors may look, play, and buy." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='11' ry='14' fill='none' stroke='%23c6a15b' stroke-width='2'/%3E%3C/svg%3E" />
<style>
  :root { --gold:#c6a15b; --paper:#f0e6d4; --ink:#140e0c; --muted:#b5a48f; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--paper); font:16px/1.45 Georgia, serif; background:#1a100e; }
  .room { min-height:100vh; background:
    radial-gradient(900px 420px at 50% 0%, rgba(198,161,91,.16), transparent 55%),
    linear-gradient(#2a1b16, #120c0b 40%, #1a100e); }
  header { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:22px 6vw 0; }
  h1 { margin:0; letter-spacing:.22em; font-size:14px; font-weight:500; }
  h1 span { color:var(--gold); }
  .sub, .note, .meta { color:var(--muted); }
  button, select, input, a.btn { font:14px/1 Georgia, serif; color:var(--paper); background:rgba(20,12,10,.55); border:1px solid #5a4634; border-radius:999px; padding:10px 14px; }
  button, a.btn { cursor:pointer; text-decoration:none; display:inline-block; }
  button.gold { border-color:var(--gold); color:var(--gold); }
  button.on { background:var(--paper); color:var(--ink); }
  main { padding:10px 6vw 80px; }
  .rail { height:8px; margin:22px 0 8px; background:linear-gradient(#8a7048, #3d2c1c); border-radius:4px; box-shadow:0 8px 16px rgba(0,0,0,.35); }
  .doors { display:grid; grid-template-columns:repeat(auto-fill, minmax(148px, 1fr)); gap:14px; }
  .doorbtn { min-height:118px; border-radius:70px 70px 16px 16px; border:3px solid #8a7048; background:
    radial-gradient(circle at 50% 30%, #4a3024, #1a100e 70%); text-align:center; padding-top:28px; }
  .doorbtn small { display:block; color:var(--muted); margin-top:8px; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; }
  .wall { display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); gap:22px 16px; }
  .card { text-align:center; }
  .frame { background:#1c120f; border:8px solid #8a7048; border-radius:80px 80px 18px 18px; box-shadow:0 16px 24px rgba(0,0,0,.4), inset 0 0 0 2px #c6a15b; aspect-ratio:4/5; display:grid; place-items:center; }
  .card.plate .frame { border-color:#c6a15b; background:radial-gradient(circle at 50% 30%, #5a2430, #1a1012 72%); }
  .frame img { width:78%; height:84%; object-fit:contain; }
  .name { margin:8px 0 0; font-size:14px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
  .chips span { border:1px solid #5a4634; border-radius:999px; padding:2px 7px; font-size:11px; color:var(--muted); }
  .buy { margin:16px 0; padding:16px; border:1px solid var(--gold); border-radius:18px; background:rgba(74,28,36,.45); }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; place-items:end center; z-index:5; }
  .sheet.on { display:grid; }
  .panel { width:min(460px, 100%); background:#1a120f; border-radius:18px 18px 0 0; padding:18px 18px 28px; }
  .panel button, .panel a, .panel input { display:block; width:100%; margin:8px 0; text-align:center; }
  @media (max-width:700px) { header { flex-direction:column; align-items:flex-start; } }
</style>
</head>
<body class="room">
<header>
  <div>
    <h1>OVAL <span>ROOM</span></h1>
    <div class="sub" id="status">Museum lobby</div>
  </div>
  <button id="connect" class="gold">Connect wallet</button>
</header>
<main>
  <div class="rail"></div>
  <p class="note" id="note">The gallery is open. An oval opens the private rooms.</p>
  <div class="doors" id="doors"></div>
  <div class="filters" id="tools"></div>
  <div id="stage" class="wall"></div>
</main>
<div class="sheet" id="sheet">
  <div class="panel">
    <p id="sheet-title">Connect</p>
    <div id="found"></div>
    <button id="use-here" class="gold">Use the wallet in this browser</button>
    <a href="https://rainbow.me/dapp/ovals.vercel.app">Open in Rainbow</a>
    <a href="https://go.cb-w.com/dapp?cb_url=https%3A%2F%2Fovals.vercel.app">Open in Coinbase Wallet</a>
    <a href="https://link.trustwallet.com/open_url?coin_id=60&url=https%3A%2F%2Fovals.vercel.app">Open in Trust Wallet</a>
    <input id="addr" placeholder="Or paste wallet address, 0x…" autocapitalize="off" autocorrect="off" spellcheck="false" />
    <button id="use-addr">Enter with this address</button>
    <button id="close-sheet">Close</button>
    <p class="note" id="sheet-note"></p>
  </div>
</div>
<script>
const CONTRACT = "0xb8611673d94f3846c619e2a146b84e793f93f931";
const CHAIN = "0x1237";
const RPC = "https://rpc.mainnet.chain.robinhood.com";
const BUY = "https://opensea.io/collection/oval-room";
const MINT_BLOCK = 83602400;
const ROOMS = [
  { id:"lobby", name:"Lobby", open:true, blurb:"Look" },
  { id:"play", name:"Play", open:true, blurb:"Guess the gaze" },
  { id:"hall", name:"Gold hall", open:true, blurb:"Public" },
  { id:"plates", name:"Plates", open:false, blurb:"Holders" },
  { id:"mine", name:"My wall", open:false, blurb:"Holders" },
  { id:"sitting", name:"Sitting", open:false, blurb:"Holders" }
];
const stage = document.getElementById("stage");
const note = document.getElementById("note");
const doors = document.getElementById("doors");
const tools = document.getElementById("tools");
let account = null, holder = false, held = [], count = 0, room = "lobby", cache = new Map(), found = [], loading = false;
function trait(nft, key) { const a = (nft.attributes || []).find(x => (x.trait_type || "").toLowerCase() === key.toLowerCase()); return a ? String(a.value) : ""; }
function hexPad(n) { return Number(n).toString(16).padStart(64, "0"); }
function validAddress(v) { return /^0x[a-fA-F0-9]{40}$/.test((v || "").trim()); }
function isPhone() { return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent); }
async function rpc(method, params) {
  const res = await fetch(RPC, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ jsonrpc:"2.0", id:1, method, params }) });
  const json = await res.json();
  if (json.error) throw new Error(json.error.message || "The chain did not answer.");
  return json.result;
}
function decodeAbiString(hex) {
  const h = hex.replace(/^0x/, "");
  const len = parseInt(h.slice(64, 128), 16);
  const bytes = h.slice(128, 128 + len * 2);
  let s = "";
  for (let i = 0; i < bytes.length; i += 2) s += String.fromCharCode(parseInt(bytes.slice(i, i + 2), 16));
  return s;
}
async function loadToken(id) {
  id = Number(id);
  if (cache.has(id)) return cache.get(id);
  const result = await rpc("eth_call", [{ to:CONTRACT, data:"0xc87b56dd" + hexPad(id) }, "latest"]);
  const meta = JSON.parse(atob(decodeAbiString(result).split(",")[1]));
  const nft = { id, ...meta, method:trait(meta,"Method"), year:trait(meta,"Year"), gaze:trait(meta,"Gaze"), hair:trait(meta,"Hair"), epoch:trait(meta,"Epoch") };
  cache.set(id, nft);
  return nft;
}
async function gather(ids) { const out = []; for (const id of ids) { try { out.push(await loadToken(id)); } catch (e) {} } return out; }
async function balanceOf(address) {
  const data = "0x70a08231" + address.toLowerCase().replace("0x", "").padStart(64, "0");
  return parseInt(await rpc("eth_call", [{ to:CONTRACT, data }, "latest"]), 16) || 0;
}
async function heldIds(address) {
  const me = address.toLowerCase();
  const latest = parseInt(await rpc("eth_blockNumber", []), 16);
  const end = Math.min(latest, MINT_BLOCK + 40000);
  const logs = [];
  for (let b = MINT_BLOCK; b <= end; b += 4000) {
    const chunk = await rpc("eth_getLogs", [{ address:CONTRACT, topics:["0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"], fromBlock:"0x"+b.toString(16), toBlock:"0x"+Math.min(end, b+3999).toString(16) }]);
    if (chunk && chunk.length) logs.push(...chunk);
  }
  logs.sort((a, c) => (a.blockNumber + a.logIndex).localeCompare(c.blockNumber + c.logIndex));
  const qty = new Map(), own = new Map();
  for (const log of logs) {
    const from = "0x" + log.topics[1].slice(26);
    const to = "0x" + log.topics[2].slice(26);
    const id = parseInt(log.topics[3], 16);
    if (from === "0x0000000000000000000000000000000000000000") {
      let n = qty.get(log.transactionHash);
      if (n == null) {
        try { n = parseInt((await rpc("eth_getTransactionByHash", [log.transactionHash])).input.slice(10, 74), 16) || 1; } catch { n = 1; }
        if (!n || n > 100) n = 1;
        qty.set(log.transactionHash, n);
      }
      for (let i = 0; i < n; i++) own.set(id + i, to);
    } else own.set(id, to);
  }
  return [...own.entries()].filter(([, who]) => who === me).map(([id]) => id).sort((a, b) => a - b);
}
function card(nft) {
  const el = document.createElement("article");
  el.className = "card" + (/plate/i.test(nft.method || "") ? " plate" : "");
  const chips = [nft.method, nft.epoch, nft.year].filter(Boolean);
  el.innerHTML = `<div class="frame">${nft.image ? `<img alt="" src="${nft.image}">` : ""}</div><div class="name">${nft.name || ("#" + nft.id)}</div><div class="chips">${chips.map(c => `<span>${c}</span>`).join("")}</div><div class="meta"><a href="https://opensea.io/item/robinhood/${CONTRACT}/${nft.id}" target="_blank" rel="noreferrer">OpenSea</a></div>`;
  return el;
}
function buyBox(text) { return `<div class="buy"><strong>${text}</strong><p class="note">Mint is over. The sweep is on OpenSea.</p><p><a href="${BUY}" target="_blank" rel="noreferrer">Buy an Oval</a></p></div>`; }
function paintDoors() {
  doors.innerHTML = "";
  ROOMS.forEach(r => {
    const locked = !r.open && !holder;
    const b = document.createElement("button");
    b.className = "doorbtn" + (room === r.id ? " on" : "");
    b.innerHTML = `${r.name}<small>${locked ? "Locked" : r.blurb}</small>`;
    b.onclick = () => { room = r.id; render(); };
    doors.appendChild(b);
  });
}
async function render() {
  paintDoors();
  document.getElementById("status").textContent = holder ? ("Holder · " + count) : account ? "Visitor" : "Museum lobby";
  tools.innerHTML = "";
  if ((room === "plates" || room === "mine" || room === "sitting") && !holder) {
    note.textContent = "That door opens for oval holders.";
    stage.innerHTML = buyBox("This room is for holders.");
    return;
  }
  if (room === "lobby" || room === "hall") {
    note.textContent = holder ? "The house is open. Your wall is through the door." : "Walk the lobby. An oval opens the rest.";
    stage.innerHTML = holder ? "" : buyBox("Hold an oval to open your wall.");
    (await gather(room === "hall" ? [1,2,3,4,8,15,20] : [1,2,3,4])).forEach(n => stage.appendChild(card(n)));
    return;
  }
  if (room === "play") {
    const nft = await loadToken(4);
    note.textContent = "Name the gaze.";
    stage.innerHTML = "";
    stage.appendChild(card(nft));
    const box = document.createElement("div");
    box.className = "buy";
    box.innerHTML = "<strong>Which way is she looking?</strong>";
    ["Aside","Down","Direct","Past you"].forEach(g => {
      const b = document.createElement("button");
      b.textContent = g;
      b.onclick = () => box.insertAdjacentHTML("beforeend", g === nft.gaze ? "<p>Yes.</p>" : "<p class='note'>Not that one.</p>");
      box.appendChild(b);
    });
    stage.appendChild(box);
    return;
  }
  note.textContent = loading ? "Hanging your ovals." : (held.length ? "Your wall." : "Looking for your numbers.");
  stage.innerHTML = held.length ? "" : (loading ? "<p class='note'>The frames are going up.</p>" : buyBox("None found yet."));
  (await gather(held.slice(0, 24))).forEach(n => stage.appendChild(card(n)));
}
async function enter(address) {
  account = address;
  localStorage.setItem("oval.address", address);
  document.getElementById("connect").textContent = address.slice(0, 6) + "…" + address.slice(-4);
  document.getElementById("sheet").classList.remove("on");
  try { count = await balanceOf(address); } catch (err) { note.textContent = err.message; count = 0; }
  holder = count > 0;
  room = holder ? "mine" : "lobby";
  loading = holder;
  render();
  if (!holder) return;
  try { held = await heldIds(address); } catch { held = []; }
  loading = false;
  render();
}
async function connectInjected(eth) {
  if (await eth.request({ method:"eth_chainId" }) !== CHAIN) {
    try { await eth.request({ method:"wallet_switchEthereumChain", params:[{ chainId:CHAIN }] }); }
    catch (err) {
      if (err.code === 4902) await eth.request({ method:"wallet_addEthereumChain", params:[{ chainId:CHAIN, chainName:"Robinhood Chain", nativeCurrency:{ name:"Ether", symbol:"ETH", decimals:18 }, rpcUrls:[RPC], blockExplorerUrls:["https://robinhoodchain.blockscout.com"] }] });
      else throw err;
    }
  }
  const accounts = await eth.request({ method:"eth_requestAccounts" });
  if (!accounts || !accounts[0]) throw new Error("The wallet returned no account.");
  await enter(accounts[0]);
}
function discovered() {
  const list = found.slice();
  const eth = window.ethereum;
  if (eth && eth.providers) eth.providers.forEach(p => { if (!list.includes(p)) list.push(p); });
  else if (eth && !list.includes(eth)) list.push(eth);
  return list;
}
window.addEventListener("eip6963:announceProvider", (event) => {
  const p = event.detail && event.detail.provider;
  if (p && !found.includes(p)) { p._ovalName = event.detail.info && event.detail.info.name; found.push(p); }
});
window.dispatchEvent(new Event("eip6963:requestProvider"));
document.getElementById("connect").onclick = () => {
  document.getElementById("sheet").classList.add("on");
  const list = discovered();
  document.getElementById("sheet-title").textContent = isPhone() ? "Open your wallet app" : "Connect on this computer";
  const box = document.getElementById("found");
  box.innerHTML = "";
  list.forEach(p => {
    const b = document.createElement("button");
    b.className = "gold";
    b.textContent = p._ovalName || "Wallet in this browser";
    b.onclick = () => connectInjected(p).catch(err => document.getElementById("sheet-note").textContent = err.message || "Connection refused.");
    box.appendChild(b);
  });
  document.getElementById("use-here").style.display = list.length ? "none" : "block";
  document.getElementById("sheet-note").textContent = isPhone() ? "Open ovals.vercel.app inside Rainbow, Coinbase, or Trust. MetaMask flags the jump link. Or paste the address." : "Pick a wallet, or paste an address.";
};
document.getElementById("close-sheet").onclick = () => document.getElementById("sheet").classList.remove("on");
document.getElementById("use-here").onclick = async () => {
  const list = discovered();
  if (!list.length) { document.getElementById("sheet-note").textContent = "No wallet in this browser. Paste the address."; return; }
  try { await connectInjected(list[0]); } catch (err) { document.getElementById("sheet-note").textContent = err.message || "Connection refused."; }
};
document.getElementById("use-addr").onclick = async () => {
  const address = document.getElementById("addr").value.trim();
  if (!validAddress(address)) { document.getElementById("sheet-note").textContent = "Paste the full address, starting with 0x."; return; }
  await enter(address);
};
render();
const saved = localStorage.getItem("oval.address");
if (saved && validAddress(saved)) enter(saved);
</script>
</body>
</html>
